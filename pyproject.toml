[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algonauts-nsd-encoding-rsa"
version = "0.1.0"
description = "Visual-cortex encoding and RSA with CLIP and ResNet features"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.23,<3",
  "scipy>=1.9,<2",
  "pandas>=1.5,<3",
  "scikit-learn>=1.2,<2",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "nbformat>=5.9,<6"]
features = [
  "torch>=2.0",
  "torchvision>=0.15",
  "open-clip-torch>=2.23",
  "Pillow>=9.5",
  "tqdm>=4.65",
]
analysis = ["statsmodels>=0.14,<1", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
