name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run synthetic smoke tests
        run: pytest
      - name: Validate and regenerate preliminary figures
        run: python scripts/build_readme_figures.py --output-dir .ci-figures
      - name: Validate notebook JSON
        run: python -c "import glob, nbformat; [nbformat.read(path, as_version=4) for path in glob.glob('notebooks/*.ipynb')]"
